[project]
name = "bumpless"
version = "0.1.0"
description = "The agent that finishes the dependency upgrade Dependabot starts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ruff>=0.6",
    "packaging>=23",
    "openai>=1.50",
    "tavily-python>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pyyaml>=6",
    "httpx>=0.27",
    "gitpython>=3.1",
    "coverage>=7.5",
    "python-dotenv>=1.0",
]

[project.scripts]
bumpless = "bumpless.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bumpless"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
extend-exclude = ["benchmarks/fixtures", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

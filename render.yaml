# One-click free hosting: https://render.com/deploy?repo=https://github.com/Fushiguro6286/bumpless
# Without keys the demo serves recorded runs only. Add keys in the Render dashboard to allow live runs.
services:
  - type: web
    name: bumpless
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: DEMO_DAILY_BUDGET_USD
        value: "2.00"

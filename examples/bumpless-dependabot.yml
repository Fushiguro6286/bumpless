# Copy to .github/workflows/bumpless.yml in your repository.
# Secrets: add NEBIUS_API_KEY and TAVILY_API_KEY as *Dependabot* secrets (Settings > Secrets > Dependabot);
# workflows triggered by Dependabot cannot read Actions secrets. Add them as Actions secrets too for manual runs.
name: Bumpless

on:
  pull_request:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      package: {description: "Package (e.g. pydantic)", required: true}
      target: {description: 'Target spec (e.g. ">=2,<3")', required: true}

permissions:
  contents: write        # push the migration commit to the PR branch
  pull-requests: write   # comment the report

jobs:
  bumpless:
    if: (github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Read Dependabot metadata
        id: meta
        if: github.event_name == 'pull_request'
        uses: dependabot/fetch-metadata@v2

      - uses: astral-sh/setup-uv@v6

      - name: Do the tests already pass?
        id: tests
        run: |
          uv venv -q && . .venv/bin/activate
          if ls requirements*.txt >/dev/null 2>&1; then uv pip install -q $(printf -- '-r %s ' requirements*.txt); else uv pip install -q -e .; fi
          uv pip install -q pytest
          if python -m pytest -q; then echo "red=false" >> "$GITHUB_OUTPUT"; else echo "red=true" >> "$GITHUB_OUTPUT"; fi

      - name: Bumpless
        # Manual runs always migrate; Dependabot PRs only on a major bump whose tests fail.
        if: github.event_name == 'workflow_dispatch' || (steps.tests.outputs.red == 'true' && startsWith(steps.meta.outputs.update-type, 'version-update:semver-major'))
        uses: Fushiguro6286/bumpless/action@main
        with:
          package: ${{ inputs.package || steps.meta.outputs.dependency-names }}
          target: ${{ inputs.target || format('=={0}', steps.meta.outputs.new-version) }}
          base-ref: ${{ github.event.pull_request.base.sha || github.sha }}
          pr-number: ${{ github.event.pull_request.number }}
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          tavily-api-key: ${{ secrets.TAVILY_API_KEY }}
          # Free NVIDIA API catalog key instead of Token Factory (not secret; plain values):
          # base-url: https://integrate.api.nvidia.com/v1
          # model-nano: nvidia/nemotron-3.5-lightning-30b-a3b
          # model-super: nvidia/nemotron-3.5-super-vl-120b-a12b
          # model-ultra: nvidia/nemotron-3-ultra-550b-a55b
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # `@bumpless <request>` comments on the PR: revise / explain / revert. Needs NEBIUS_API_KEY as an *Actions* secret
  # (comment workflows run as the commenter, not as Dependabot).
  respond:
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@bumpless')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.issue.number }}
    steps:
      - name: Only owners, members and collaborators; no fork PRs
        id: gate
        env:
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          case "$ASSOCIATION" in OWNER|MEMBER|COLLABORATOR) ;; *)
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "Thanks for the suggestion! I only act on requests from this repository's owners, members and collaborators, so I haven't changed anything."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0;; esac
          head=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRepositoryOwner,headRepository,headRefName --jq '"\(.headRepositoryOwner.login)/\(.headRepository.name) \(.headRefName)"')
          if [ "${head% *}" != "$GITHUB_REPOSITORY" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=true" >> "$GITHUB_OUTPUT"; echo "ref=${head#* }" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
        with: {ref: "${{ steps.gate.outputs.ref }}", fetch-depth: 0}

      - if: steps.gate.outputs.ok == 'true'
        run: git config user.name "bumpless[bot]" && git config user.email "bumpless@users.noreply.github.com"

      - if: steps.gate.outputs.ok == 'true'
        uses: Fushiguro6286/bumpless/action/comment@main
        with:
          pr-number: ${{ github.event.issue.number }}
          comment-body: ${{ github.event.comment.body }}
          association: ${{ github.event.comment.author_association }}
          user: ${{ github.event.comment.user.login }}
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          # Free NVIDIA API catalog key instead of Token Factory (not secret; plain values):
          # base-url: https://integrate.api.nvidia.com/v1
          # model-nano: nvidia/nemotron-3.5-lightning-30b-a3b
          # model-super: nvidia/nemotron-3.5-super-vl-120b-a12b
          # model-ultra: nvidia/nemotron-3-ultra-550b-a55b
          github-token: ${{ secrets.GITHUB_TOKEN }}
